name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Extension validate (${{ matrix.check-against }} supported Shopware)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check-against: [ lowest, highest ]
    steps:
      - uses: actions/checkout@v4

      # Deprecation notices differ between the lowest and the highest supported Shopware
      # release, so no code satisfies both; a local check still reports them.
      - name: Ignore deprecation notices
        run: |
          cat > .shopware-extension.yml <<'YAML'
          validation:
            ignore:
              - message: "deprecated"
          YAML

      - name: shopware-cli extension validate
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check
          check-against: ${{ matrix.check-against }}

  tests:
    name: PHPUnit (Shopware 6.7.16.0)
    runs-on: ubuntu-latest
    steps:
      # Checks out Shopware to the workspace root and this repository to
      # custom/plugins/ActPriceHide, then installs its composer requirements.
      - name: Set up Shopware
        uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ActPriceHide
          shopwareVersion: v6.7.16.0
          phpVersion: '8.4'

      # Same call and timezone as the development setup; tests derive expected
      # values from date.timezone.
      - name: PHPUnit
        run: vendor/bin/phpunit -d date.timezone=Europe/Berlin -c custom/plugins/ActPriceHide/phpunit.xml.dist
